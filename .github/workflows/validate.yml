name: Validate public profile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate current professional positioning
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')

          required = [
              'Analista de Automação e IA',
              'Python',
              'APIs',
              'Power Automate',
              'operação de TI',
              'tradutor documental',
              'Scanner de documentos',
              'plataforma SaaS B2B multiempresa',
              'colaboração independente da minha função atual',
              'Belarc Inventory',
              'Produção Operacional',
              'ComprasVesper',
              'Postagem Redes',
              'Central ISO',
              'Instrutor de Informática Freelancer',
              'Maycon_Ferreira_Analista_Automacao_IA_Integracoes.pdf',
              'Maycon_Ferreira_Automacao_IA_n8n_Python_LLMs.pdf',
              'Maycon_Ferreira_Automacao_BI_Power_Automate_Power_BI.pdf',
              'Maycon_Ferreira_AI_Automation_Integrations_Analyst.pdf',
          ]
          forbidden = [
              'Portal Vesper',
              'ProcureFlow',
              'PlanilhaCompras',
              '3h → 5min',
              '10 mil+ execuções da Mala Direta',
              '11 computadores do escritório',
              'sênior em IA',
              'senior AI',
          ]

          errors = []
          for phrase in required:
              if phrase not in text:
                  errors.append(f'missing current profile fact: {phrase}')
          for phrase in forbidden:
              if phrase in text:
                  errors.append(f'stale or inflated profile wording: {phrase}')

          if errors:
              for error in errors:
                  print(f'ERROR: {error}')
              raise SystemExit(1)

          print('Public profile positioning and current facts validated.')
          PY
